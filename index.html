<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="reset.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="//code.iconify.design/1/1.0.6/iconify.min.js"></script>
  <title>Document</title>
</head>

<body>
  <div class="container">
    <div class="header">
      <div class="header_top">
        <div class="searchbar">
          <button class="searchbar_button"><span class="iconify" data-icon="mdi-search"></span></button>
          <input class="searchbar_input" type="text">
        </div>
        <div class="profile">
          <button><span class="iconify" data-icon="mdi-bell-ring-outline"></span></button>
          <img src="profile.jpg" alt="Profile image">
          <p>Morgan Oakley</p>
        </div>
      </div>
      <div class="header_bottom">
        <div class="profile-info">
          <img src="profile.jpg" alt="Profile image">
          <div class="profile-info_text">
            <p>Hi there,</p>
            <h1>Morgan Oakley</h1>
          </div>
        </div>
        <div class="action-buttons">
          <button>New</button>
          <button>Upload</button>
          <button>Share</button>
        </div>
      </div>
    </div>
    <div class="sidebar">
      <p class="title"><span class="iconify" data-icon="mdi-view-dashboard"></span> Dashboard</p>
      <div class="menu">
        <ul>
          <li><a href=""><span class="iconify" data-icon="mdi-home"></span> Home</a></li>
          <li><a href=""><span class="iconify" data-icon="mdi-card-account-details-outline"></span> Profile</a></li>
          <li><a href=""><span class="iconify" data-icon="mdi-message-reply"></span> Messages</a></li>
          <li><a href=""><span class="iconify" data-icon="mdi-clock"></span> History</a></li>
          <li><a href=""><span class="iconify" data-icon="mdi-note-multiple"></span> Tasks</a></li>
          <li><a href=""><span class="iconify" data-icon="mdi-account-group"></span> Communities</a></li>
        </ul>
      </div>
      <div class="options">
        <ul>
          <li><a href=""><span class="iconify" data-icon="mdi-cog"></span> Settings</a></li>
          <li><a href=""><span class="iconify" data-icon="mdi-help-box"></span> Support</a></li>
          <li><a href=""><span class="iconify" data-icon="mdi-shield-check"></span> Privacy</a></li>
        </ul>
      </div>
    </div>
    <div class="content">
      <p>Here's the main content</p>
    </div>
  </div>
</body>

</html>
